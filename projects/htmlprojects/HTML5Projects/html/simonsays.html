<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simon Says</title>
    <style>
        :root {
    --green: #2ecc71;
    --red: #e74c3c;
    --yellow: #f1c40f;
    --blue: #3498db;
    --light-bg: #ecf0f1;
    --dark-bg: #2c3e50;
    --hard-bg: #522525;
}

body{
    font-family: Arial, sans-serif;
    background-color: var(--dark-bg);
    color: var(--light-bg);
    text-align: center;
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

.hard-bg{
    background-color: var(--hard-bg);
}

.game-info{
    font-size: 1.5rem;
    margin: 1rem 0;
}

.game-container{
    display: flex;
    flex-direction: row;
    gap: 20px;
    margin-top: 20px;
}

.simon-button {
    width: 150px;
    height: 150px;
    border-radius: 15px;
    border: 5px solid #000;
    opacity: 0.6;
    transition: opacity 0.2s, box-shadow 0.2s;
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 4rem;
    user-select: none;
}

.simon-button:hover {
    opacity: 1;
}

.simon-button.lit {
    opacity: 1;
    box-shadow: 0 0 20px 5px #fff;
    transform: scale(1.05);
}

.simon-button.lit-click {
    opacity: 1;
    transform: scale(0.95);
}

#green { 
    background-color: var(--green); 
}

#red { 
    background-color: var(--red); 
}

#yellow { 
    background-color: var(--yellow); 
}

#blue { 
    background-color: var(--blue); 
}

/* Responsive Media Query for 2x2 Grid */
@media (max-width: 720px) {
    .game-container {
        display: grid;
        grid-template-columns: 1fr 1fr;
        width: 320px; /* Fixed width for grid */
    }   
}

/* Success Message */
#success-message {
    color: #27ae60;
    font-weight: bold;
    transition: opacity 0.3s;
    font-size: 1.2rem;
}

.hidden {
    opacity: 0;
}

.modal-container {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.8);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 10;
}

.modal-container.show {
    display: flex;
}

.modal-content {
    background-color: var(--light-bg);
    color: var(--dark-bg);
    padding: 2rem;
    border-radius: 10px;
    text-align: center;
    width: 90%;
    max-width: 400px;
}

.high-scores {
    margin: 1.5rem 0;
    border-top: 1px solid #ccc;
    border-bottom: 1px solid #ccc;
    padding: 1rem 0;
}

.modal-buttons {
    display: flex;
    justify-content: center;
    gap: 1rem;
}

.modal-content button {
    padding: 10px 20px;
    font-size: 1rem;
    border: none;
    border-radius: 5px;
    color: white;
    cursor: pointer;
    transition: opacity 0.3s;
}

.modal-content button:hover {
    opacity: 0.8;
}

#play-btn { 
    background-color: var(--blue); 
}

#play-btn-hard {
    background-color: var(--red); 
}</style>
</head>
<body>
    <h1>Simon Says</h1>
    <div class="game-info">
        <p>Level: <span id="level-display">0</span></p>
    </div>
    <div class="game-container">
        <button class="simon-button" id="green">🎹</button>
        <button class="simon-button" id="red">🎸</button>
        <button class="simon-button" id="yellow">🎺</button>
        <button class="simon-button" id="blue">🥁</button>
    </div>
    <p class="hidden" id="success-message">Nice!</p>

    <div class="modal-container show" id="menu-modal">
        <div class="modal-content">
            <h2 id="modal-title">Welcome to Simon Says!</h2>
            <p id="modal-message">Select a mode to begin.</p>
            <div class="high-scores">
                <p><b>Highest Reached Level:</b></p>
                <p>
                    Normal Mode: <b><span id="high-score">0</span></b>
                    <br>
                    Hard Mode: <b><span id="high-score-hard">0</span></b>
                </p>
            </div>
            <div class="modal-buttons">
                <button id="play-btn">Play Normal</button>
                <button id="play-btn-hard">Play Hard</button>
            </div>
        </div>
    </div>

    <script>
        const buttons = {
    green: document.getElementById('green'),
    red: document.getElementById('red'),
    yellow: document.getElementById('yellow'),
    blue: document.getElementById('blue')
}
const levelDisplaySpan = document.getElementById('level-display');
const successMessage = document.getElementById('success-message');

const modalTitle = document.getElementById('modal-title');
const modalMessage = document.getElementById('modal-message');
const menuModal = document.getElementById('menu-modal');
const highScoreSpan = document.getElementById('high-score');
const highScoreSpanHard = document.getElementById('high-score-hard');
const playBtn = document.getElementById('play-btn');
const playBtnHard = document.getElementById('play-btn-hard');

const sounds = {
    color_green: "https://kidocode-asset.s3-ap-southeast-1.amazonaws.com/hoc/assets/courses/bc948cd5fb.mp3",
    color_red: "https://kidocode-asset.s3-ap-southeast-1.amazonaws.com/hoc/assets/courses/38006599fd.mp3",
    color_yellow: "https://kidocode-asset.s3-ap-southeast-1.amazonaws.com/hoc/assets/courses/fe28030b74.mp3",
    color_blue: "https://kidocode-asset.s3-ap-southeast-1.amazonaws.com/hoc/assets/courses/14a10f6bac.mp3",
    fail: "https://kidocode-asset.s3-ap-southeast-1.amazonaws.com/hoc/assets/courses/0238991165.mp3"
};

function playSound(soundKey){
    const audio = new Audio(sounds[soundKey]);
    audio.play();
    return audio;
};

let sequence = [];
let playerSequence = [];
let level = 0;
let isPlayerTurn = false;
let gameMode = '';
let highScore = localStorage.getItem('simonSaysHighScore') || 0;
let highScoreHard = localStorage.getItem('simonSaysHighScoreHard') || 0;

function playSequence(){
    const sequenceToPlay = gameMode === 'normal' ? sequence : [sequence[sequence.length - 1]];
    sequenceToPlay.forEach((color, index) => {
        setTimeout(() => lightUpButton(color), (index + 1) * 600);
    });
    setTimeout(() => isPlayerTurn = true, (sequence.length + 1) * 600);
}

function nextRound(){
    isPlayerTurn = false;
    playerSequence = [];
    level++;
    levelDisplaySpan.innerText = level;
    const colors = Object.keys(buttons);
    const randomColor = colors[Math.floor(Math.random() * colors.length)];
    sequence.push(randomColor);
    playSequence();
}

function startGame(){
    level = 0;
    sequence = [];
    nextRound();
}

function handlePlayerInput(color){
    if (isPlayerTurn)
        clickButton(color);
    playerSequence.push(color);

    const currentIndex = playerSequence.length - 1;
    if (playerSequence[currentIndex] !== sequence[currentIndex]){
        isPlayerTurn = false;
        setTimeout(endGame, 500);
        return;
    }

    if (playerSequence.length === sequence.length){
        isPlayerTurn = false;
        setTimeout(nextRound, 1000);
        showSuccessMessage();
    }
}

function showSuccessMessage(){
    successMessage.classList.remove('hidden');
    setTimeout(() => successMessage.classList.add('hidden'), 600);
}

function endGame(){
    playSound('fail');
    modalTitle.innerText = "Game Over!";
    modalMessage.innerText = `You reached level ${level}.`;

    if (gameMode === 'normal'){
        if (level > highScore){
            highScore = level;
            localStorage.setItem('simonSaysHighScore', highScore);
        }
    }else{
        if (level > highScoreHard){
            highScoreHard = level;
            localStorage.setItem('simonSaysHighScoreHard', highScoreHard);
        }
    }

    highScoreSpan.innerText = highScore;
    highScoreSpanHard.innerText = highScoreHard;
    menuModal.classList.add('show');
}

function clickButton(color){
    const button = buttons[color];
    button.classList.add("lit-click");
    setTimeout(() => button.classList.remove("lit-click"), 100);
    playSound(`color_${color}`);
}

function lightUpButton(color){
    const button = buttons[color];
    button.classList.add("lit");
    setTimeout(() => button.classList.remove("lit"), 400);
    playSound(`color_${color}`);
}

Object.keys(buttons).forEach(color => {
    buttons[color].addEventListener('click', () => handlePlayerInput(color));
});

playBtn.addEventListener('click', () => {
    gameMode = 'normal';
    document.body.classList.remove('hard-bg');
    startGame();
    menuModal.classList.remove('show');
})
playBtnHard.addEventListener('click', () => {
    gameMode = 'hard';
    document.body.classList.add('hard-bg');
    startGame();
    menuModal.classList.remove('show');
})

highScoreSpan.innerText = highScore;
highScoreSpanHard.innerText = highScoreHard;
    </script>
</body>
</html>
