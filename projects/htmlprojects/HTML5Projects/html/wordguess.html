<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Guess Game</title>
    <style>
    body {
    font-family: Arial, sans-serif;
    color: #333;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    background-image: url("https://kidocode-asset.s3-ap-southeast-1.amazonaws.com/hoc/assets/courses/1ced0a271b.jpg");
    background-repeat: no-repeat;
    background-attachment: fixed; 
    background-size: 100% 100%;
}

h1 {
    color: white;
    font-size: 2.5rem;
}

.game-container{
    background-color: white;
    padding: 2rem;
    border-radius: 10px;
    border: 4px solid #aaa;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    text-align: center;
    width: 90%;
    max-width: 700px;
}

.word-display {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 2rem;
}

.letter-container {
    width: 40px;
    height: 50px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
}

.letter {
    font-size: 2.2rem;
    font-weight: bold;
    text-transform: uppercase;
    line-height: 1;
    opacity: 0;
    transform: scale(1.5);
}

.letter-container.revealed .letter {
    animation: fadeInScale 0.5s forwards;
}

@keyframes fadeInScale {
    to {
        opacity: 1;
        transform: scale(1);
    }
}

.letter.hint-revealed {
    color: rgb(34, 127, 209);
}

.underline {
    width: 100%;
    height: 3px;
    background-color: #4a4e69;
}

.game-info {
    margin-bottom: 2rem;
}

.theme-text {
    font-size: 1.2rem;
    font-weight: bold;
    color: #4a4e69;
    margin-bottom: 1rem;
}

.hearts-container {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 1rem;
}

.heart {
    font-size: 1.5rem;
    color: #e5383b;
    transition: color 0.3s ease;
}

.heart.grey {
    color: #ccc;
}

.keyboard {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    margin-bottom: 1.5rem;
}

.keyboard button {
    width: 45px;
    height: 45px;
    font-size: 1.2rem;
    font-weight: bold;
    background-color: #6a7fdb;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background-color 0.2s;
}

.keyboard button:hover {
    background-color: #4a5a9c;
}

.keyboard button:disabled {
    background-color: #999;
    cursor: not-allowed;
    opacity: 0.7;
}

.modal-container {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgb(0, 0, 0, 0.6);
    display: none;
    align-items: center;
    justify-content: center;
}

.modal-container.show {
    display: flex;
}

.modal-content {
    background-color: white;
    padding: 2rem 3rem;
    border-radius: 10px;
    text-align: center;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
}

#modal-title{
    margin-top: 0;
    font-size: 2rem;
}

#play-again-btn {
    padding: 10px 20px;
    font-size: 1rem;
    background-color: #6a7fdb;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    margin-top: 1rem;
    transition: background-color 0.2s;
}

#play-again-btn:hover {
    background-color: #4a5a9c;
}

#hint-btn {
    padding: 10px 25px;
    font-size: 1.1rem;
    background-color: rgb(34, 127, 209);
    color: #fff;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    transition: background-color 0.2s;
}

#hint-btn:hover {
    background-color: rgb(86, 152, 210);
}

#hint-btn:disabled {
    background-color: #ccc;
    color: #888;
    cursor: not-allowed;
}
    </style>
</head>
<body>
    <h1>Word Guess</h1>

    <div class="game-container">
        <div class="word-display">
        </div>
        <div class="game-info">
            <p class="theme-text">Theme: <span id="word-theme"></span></p>
            <div class="hearts-container">
            </div>
        </div>
        <div class="keyboard">
        </div>
        <button id="hint-btn">HINT</button>

    </div>

    <div class="modal-container" id="result-modal">
        <div class="modal-content">
            <h2 id="modal-title"></h2>
            <p id="modal-message"></p>
            <button id="play-again-btn">Play Again</button>
        </div>
    </div>

    <script>
    const keyboardContainer = document.querySelector('.keyboard');
const wordDisplay = document.querySelector('.word-display');
const heartsContainer = document.querySelector('.hearts-container');
const themeText = document.querySelector('#word-theme');
const modal = document.querySelector('#result-modal');
const modalTitle = document.querySelector('#modal-title');
const modalMessage = document.querySelector('#modal-message');
const playAgainBtn = document.querySelector('#play-again-btn');
const hintBtn = document.querySelector('#hint-btn');

const sounds = {
    correct: 'https://kidocode-asset.s3-ap-southeast-1.amazonaws.com/hoc/assets/courses/f4c6b650c8.mp3',
    wrong: 'https://kidocode-asset.s3-ap-southeast-1.amazonaws.com/hoc/assets/courses/ffe68666f3.mp3',
    win: 'https://kidocode-asset.s3-ap-southeast-1.amazonaws.com/hoc/assets/courses/27ed0c9071.mp3',
    lose: 'https://kidocode-asset.s3-ap-southeast-1.amazonaws.com/hoc/assets/courses/9b0a7254b1.mp3'
};

function playSound(soundKey){
    const audio = new Audio(sounds[soundKey]);
    audio.play();
    return audio;
};

let currentWord = '';
let correctLetters = [];
let wrongGuessCount = 0;
const maxGuesses = 6;
const wordPacks = {
    Animal: ["elephant", "giraffe", "dolphin", "penguin", "cheetah"],
    Space: ["galaxy", "planet", "comet", "nebula", "asteroid"],
    Food: ["pizza", "sushi", "taco", "waffle", "burger"]
};
let fanfareSound = null;

function generateKeyboard(){
    for (let i = 'A'.charCodeAt(0); i <= 'Z'.charCodeAt(0); i++){
        const button = document.createElement("button");
        button.innerText = String.fromCharCode(i);
        keyboardContainer.appendChild(button);
        button.addEventListener("click", (e) => handleGuess(e.target.innerText));
    }
}

function handleGuess(letter){
    const buttons = keyboardContainer.querySelectorAll('button');
    for (let button of buttons){
        if (button.innerText === letter)
            button.disabled = true;
    }
    const word = currentWord.toLowerCase();
    letter = letter.toLowerCase();
    if (word.includes(letter)){
        playSound('correct');
        const chars = word.split('');
        chars.forEach((char, index) => {
            if (char === letter) {
                correctLetters.push(letter);
                const letterContainer = wordDisplay.querySelectorAll('.letter-container')[index];
                letterContainer.querySelector('.letter').innerText = letter;
                letterContainer.classList.add('revealed');
            }
        });
    }else{
        handleIncorrectGuess();
    }
    setTimeout(checkGameState, 500);
    updateHintButtonState();
}

function handleIncorrectGuess(){
    playSound('wrong');
    wrongGuessCount++;
    const hearts = document.querySelectorAll(".heart");
    if (hearts.length - wrongGuessCount >= 0) {
        hearts[hearts.length - wrongGuessCount].classList.add('grey');
    }
}

function checkGameState(){
    if (wrongGuessCount === maxGuesses){
        fanfareSound = playSound('lose');
        modalTitle.innerText = '🥀 Game Over! 🥀';
        modalMessage.innerHTML = `The correct word was: <br><b>${currentWord}</b>`;
        modal.classList.add('show');
    }
    if (correctLetters.length === currentWord.length){
        fanfareSound = playSound('win');
        modalTitle.innerText = '🎉 Congratulations! 🎉';
        modalMessage.innerHTML = `You guessed the word: <br><b>${currentWord}</b>`;
        modal.classList.add('show');
    }
}

function getRandomWord(){
    const themes = Object.keys(wordPacks);
    const randomTheme = themes[Math.floor(Math.random()*themes.length)];
    const wordsInTheme = wordPacks[randomTheme];
    const randomWord = wordsInTheme[Math.floor(Math.random()*wordsInTheme.length)];
    currentWord = randomWord;
    themeText.innerText = randomTheme;
    resetGame();
}

function resetGame(){
    correctLetters = [];
    wrongGuessCount = 0;
    wordDisplay.innerHTML = currentWord.split("").map(() => `
    <div class="letter-container">
        <span class="letter"></span>
        <div class="underline"></div>
    </div>
    `).join("");
    heartsContainer.innerHTML = '';
    for (let i = 0; i < maxGuesses; i++) {
        const heart = document.createElement('span');
        heart.className = 'heart';
        heart.innerHTML = '&#x2764;'; // Heart character
        heartsContainer.appendChild(heart);
    }
    const buttons = keyboardContainer.querySelectorAll("button")
    for (let button of buttons){
        button.disabled = false;
    }
    modal.classList.remove('show');
    updateHintButtonState();
}
function giveHint() {
    handleIncorrectGuess(); // Using a hint costs one life

    const unrevealedLetters = [];
    currentWord.split('').forEach((letter, index) => {
        if (!correctLetters.includes(letter)) {
            unrevealedLetters.push({ letter, index });
        }
    });

    // Prioritize vowels
    const vowels = ['a', 'e', 'i', 'o', 'u'];
    let hintLetters = unrevealedLetters.filter(item => vowels.includes(item.letter));

    if (hintLetters.length === 0) {
        // If no vowels are left, use any unrevealed letter
        hintLetters = unrevealedLetters;
    }

    if (hintLetters.length > 0) {
        const randomHint = hintLetters[Math.floor(Math.random() * hintLetters.length)];
        console.log(randomHint);

        const letter = randomHint.letter;
        for (let i = 0; i < currentWord.length; i++){
            if (currentWord[i] == letter){
                correctLetters.push(letter);
                const letterContainer = wordDisplay.querySelectorAll('.letter-container')[i];
                const letterSpan = letterContainer.querySelector('.letter');
                letterSpan.innerText = letter;
                letterSpan.classList.add('hint-revealed');
                letterContainer.classList.add('revealed');
            }
        }

        // Disable the keyboard button for the hinted letter
        const buttons = keyboardContainer.querySelectorAll('button');
        buttons.forEach(button => {
            if (button.innerText.toLowerCase() === letter) {
                button.disabled = true;
            }
        });
    }

    updateHintButtonState();
};

function updateHintButtonState(){
    unrevealedCount = currentWord.length - correctLetters.length;
    if (wrongGuessCount >= maxGuesses - 1 || unrevealedCount <= 1){
        hintBtn.disabled = true;
    }else{
        hintBtn.disabled = false;
    }
}

playAgainBtn.addEventListener("click", () => {
    if (fanfareSound){
        fanfareSound.pause();
        fanfareSound.currentTime = 0;
        fanfareSound = null;
    }
    getRandomWord();
});

hintBtn.addEventListener("click", giveHint);

generateKeyboard();
getRandomWord();
    </script>
</body>
</html>
