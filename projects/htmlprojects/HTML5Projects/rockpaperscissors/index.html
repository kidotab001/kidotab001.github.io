<!DOCTYPE  html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Rock, Paper, Scissors</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="game-container">
    <h1>Rock, Paper, Scissors</h1>
    <p class="center">Choose an option:</p>
    
    <div class="center">
        <button class="choice-btn" onclick="play('rock')">Rock</button>
        <button class="choice-btn" onclick="play('paper')">Paper</button>
        <button class="choice-btn" onclick="play('scissors')">Scissors</button>
    </div>
    
    <div class="center">
        <p id="p-player-choice"></p>
        <p id="p-computer-choice"></p>
        <p id="p-game-result"></p>
    </div>
    
  <script src="app.js"></script>
</div>  
</body>
